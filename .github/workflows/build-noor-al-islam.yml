name: Build Noor Al-Islam APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Noor-Al-Islam/**'
      - '.github/workflows/build-noor-al-islam.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Noor-Al-Islam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Islam-debug-apk
          path: Noor-Al-Islam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
