<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071c16"><title>نور الإسلام</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071c16;color:white;font-family:system-ui,Tahoma,Arial;overflow:hidden}header{position:fixed;z-index:5;top:0;right:0;left:0;padding:16px;background:linear-gradient(#06130fe8,transparent);font-weight:bold;color:#f2d58a;font-size:21px}header small{display:block;color:#e3eee7;font-size:11px;font-weight:normal}#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.card{height:100dvh;position:relative;scroll-snap-align:start;background:radial-gradient(circle at 50% 35%,#246149,#071c16 68%)}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 45%,#06130fbd)}.caption{position:absolute;right:16px;left:76px;bottom:90px}.caption h2{font-size:21px}.caption p{font-size:14px;line-height:1.7}.actions{position:absolute;left:12px;bottom:112px;display:flex;flex-direction:column;gap:16px}.action{border:0;background:#ffffff25;color:white;border-radius:50%;width:48px;height:48px;font-size:22px}.action span{display:block;font-size:10px}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#06130ff2;display:flex;justify-content:space-around;align-items:center;z-index:6}.bottom button{background:none;border:0;color:#f2d58a;font-size:12px}.bottom b{display:block;font-size:19px}</style></head><body><header>☪ نور الإسلام<small>مقاطع إيمانية قصيرة</small></header><main id="feed"></main><nav class="bottom"><button onclick="home()"><b>⌂</b>الرئيسية</button><button onclick="categories()"><b>▦</b>الأقسام</button><button onclick="savedPage()"><b>♡</b>المحفوظات</button></nav><script>
const videos=[{id:'dZTfXiPSZyE',title:'سورة الرحمن — مشاري العفاسي',desc:'تلاوة من القرآن الكريم عبر مشغّل يوتيوب الرسمي.',cat:'القرآن الكريم'},{id:'xrZALrmabb0',title:'أذكار الصباح والمساء — مشاري العفاسي',desc:'أذكار وأدعية من قناة العفاسي الرسمية.',cat:'الأذكار والأدعية'}];let saved=JSON.parse(localStorage.getItem('noorSaved')||'[]');let feed=document.getElementById('feed');function render(list=videos){feed.innerHTML='';list.forEach(v=>{let c=document.createElement('section');c.className='card';c.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?playsinline=1&rel=0" title="${v.title}" allow="accelerometer; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe><div class="shade"></div><div class="caption"><h2>${v.title}</h2><p>${v.desc}</p><p style="color:#f2d58a">#${v.cat}</p></div><div class="actions"><button class="action" onclick="toggle('${v.id}')">${saved.includes(v.id)?'★':'☆'}<span>حفظ</span></button><button class="action" onclick="share('${v.id}')">↗<span>مشاركة</span></button></div>`;feed.appendChild(c)})}function toggle(id){saved=saved.includes(id)?saved.filter(x=>x!==id):saved.concat(id);localStorage.setItem('noorSaved',JSON.stringify(saved));render()}function share(id){let u='https://www.youtube.com/watch?v='+id;if(navigator.share)navigator.share({title:'نور الإسلام',url:u});else prompt('انسخ رابط المقطع',u)}function home(){render();feed.scrollTop=0}function categories(){let q=prompt('اكتب القسم: القرآن الكريم أو المواعظ أو الأذكار والأدعية');if(q){let a=videos.filter(v=>v.cat.includes(q));render(a);if(!a.length)alert('لا توجد مقاطع بهذا القسم في القائمة التجريبية.')}}function savedPage(){let a=videos.filter(v=>saved.includes(v.id));render(a);if(!a.length)alert('لم تحفظ مقاطع بعد.')}render();</script></body></html>
