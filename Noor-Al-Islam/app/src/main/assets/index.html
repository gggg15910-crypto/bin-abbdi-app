<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071c16"><title>نور الإسلام</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071c16;color:white;font-family:system-ui,Tahoma,Arial;overflow:hidden}header{position:fixed;z-index:10;top:0;right:0;left:0;padding:15px 16px;background:linear-gradient(#06130ff0,transparent);font-weight:bold;color:#f2d58a;font-size:21px;pointer-events:none}header small{display:block;color:#e3eee7;font-size:11px;font-weight:normal}#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.card{height:100dvh;position:relative;scroll-snap-align:start;background:radial-gradient(circle at 50% 35%,#246149,#071c16 68%)}.player{position:absolute;top:0;right:0;width:100%;height:100%;border:0;background:#000}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 48%,#06130fc9);z-index:1}.caption{position:absolute;z-index:3;right:16px;left:76px;bottom:91px;pointer-events:none}.caption h2{font-size:21px}.caption p{font-size:14px;line-height:1.7}.actions{position:absolute;z-index:4;left:12px;bottom:112px;display:flex;flex-direction:column;gap:16px}.action{border:0;background:#ffffff35;color:white;border-radius:50%;width:48px;height:48px;font-size:22px}.action span{display:block;font-size:10px}.status{position:absolute;z-index:4;top:45%;right:15%;left:15%;text-align:center;background:#071c16d9;padding:14px;border-radius:14px;pointer-events:none}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#06130ff2;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom button{background:none;border:0;color:#f2d58a;font-size:12px}.bottom b{display:block;font-size:19px}.social-panel{position:absolute;inset:76px 16px 78px;overflow:auto;background:#0d2b21;border:1px solid #32624d;border-radius:18px;padding:18px}.social-panel h2{color:#f2d58a}.social-btn{display:block;width:100%;margin:12px 0;padding:15px;border:1px solid #46785f;border-radius:12px;background:#174632;color:white;text-align:right;font-size:15px}.social-panel p{line-height:1.8;color:#d7e7dd;font-size:13px}</style></head><body><header>☪ نور الإسلام<small>شاهد المقاطع هنا مباشرة دون فتح تطبيق يوتيوب</small></header><main id="feed"></main><nav class="bottom"><button onclick="home()"><b>⌂</b>الرئيسية</button><button onclick="categories()"><b>▦</b>الأقسام</button><button onclick="savedPage()"><b>♡</b>المحفوظات</button><button onclick="socialPage()"><b>▶</b>مقاطع جديدة</button></nav><script>
const videos=[
{id:'dZTfXiPSZyE',title:'سورة الرحمن — مشاري العفاسي',desc:'تلاوة من القرآن الكريم',cat:'القرآن الكريم'},
{id:'xrZALrmabb0',title:'أذكار الصباح والمساء — مشاري العفاسي',desc:'أذكار وأدعية',cat:'الأذكار والأدعية'}
];
let saved=JSON.parse(localStorage.getItem('noorSaved')||'[]');let feed=document.getElementById('feed');
function render(list=videos){feed.innerHTML='';list.forEach((v,i)=>{let c=document.createElement('section');c.className='card';c.innerHTML=`<iframe class="player" src="https://www.youtube-nocookie.com/embed/${v.id}?playsinline=1&rel=0&controls=1&enablejsapi=1&origin=https%3A%2F%2Fappassets.androidplatform.net" title="${v.title}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><div class="shade"></div><div class="caption"><h2>${v.title}</h2><p>${v.desc}</p><p style="color:#f2d58a">#${v.cat}</p></div><div class="actions"><button class="action" onclick="toggle('${v.id}')">${saved.includes(v.id)?'★':'☆'}<span>حفظ</span></button><button class="action" onclick="share('${v.id}')">↗<span>مشاركة</span></button></div>`;feed.appendChild(c)})}
function toggle(id){saved=saved.includes(id)?saved.filter(x=>x!==id):saved.concat(id);localStorage.setItem('noorSaved',JSON.stringify(saved));render()}
function share(id){let u='https://www.youtube.com/watch?v='+id;if(navigator.share)navigator.share({title:'نور الإسلام',url:u}).catch(()=>{});else prompt('انسخ رابط المقطع',u)}
function home(){render();feed.scrollTop=0}
function categories(){let q=prompt('اكتب القسم: القرآن الكريم أو الأذكار والأدعية');if(q){let a=videos.filter(v=>v.cat.includes(q));render(a);if(!a.length)alert('لا توجد مقاطع بهذا القسم حاليًا.')}}
function savedPage(){let a=videos.filter(v=>saved.includes(v.id));render(a);if(!a.length)alert('لم تحفظ مقاطع بعد.')}

function socialPage(){
feed.innerHTML='<section class="card"><div class="social-panel"><h2>مقاطع إسلامية جديدة</h2><p>اختر منصة لعرض أحدث نتائج البحث العامة. تتغير النتائج حسب المنشورات المتاحة وقد تطلب المنصة تسجيل الدخول.</p><button class="social-btn" onclick="goSocial(1)">📘 مقاطع إسلامية على فيسبوك</button><button class="social-btn" onclick="goSocial(2)">📗 تلاوات القرآن على فيسبوك</button><button class="social-btn" onclick="goSocial(3)">𝕏 مقاطع إسلامية حديثة على X / تويتر</button><button class="social-btn" onclick="goSocial(4)">🤲 أذكار ودعاء على X / تويتر</button><button class="social-btn" onclick="home()">↩ العودة إلى مقاطع التطبيق</button><p>تُحمّل النتائج من المنصة مباشرة عند فتحها. لا يتم تنزيل محتوى أصحاب المقاطع أو نسخه.</p></div></section>';
}
function goSocial(type){
const urls=[
'https://www.facebook.com/watch/search/?q='+encodeURIComponent('مقاطع إسلامية'),
'https://www.facebook.com/watch/search/?q='+encodeURIComponent('تلاوات القرآن الكريم'),
'https://x.com/search?q='+encodeURIComponent('مقاطع إسلامية')+'&src=typed_query&f=live',
'https://x.com/search?q='+encodeURIComponent('أذكار دعاء')+'&src=typed_query&f=live'
];
location.href=urls[type-1]||urls[0];
}

render();
</script></body></html>
